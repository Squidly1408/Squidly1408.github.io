<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loop &amp; Pixel">
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DC6A3A"/>
      <stop offset="1" stop-color="#B03F1E"/>
    </linearGradient>
    <!-- one knit stitch: two leaning legs forming a V, drawn in a 14×14 cell -->
    <g id="lp-st">
      <path d="M6.6 13.4C2.6 12.3.4 7.6.9.9 4.9 1.5 7.3 5.6 6.6 13.4Z"/>
      <path d="M7.4 13.4C11.4 12.3 13.6 7.6 13.1.9 9.1 1.5 6.7 5.6 7.4 13.4Z"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#lp-bg)"/>
  <!-- stitches (bottom-left) -->
  <g fill="#FFF4E6">
    <use href="#lp-st" x="9" y="9"/>
    <use href="#lp-st" x="9" y="25"/>
    <use href="#lp-st" x="25" y="25"/>
    <use href="#lp-st" x="9" y="41"/>
    <use href="#lp-st" x="25" y="41"/>
    <use href="#lp-st" x="41" y="41"/>
  </g>
  <!-- pixels (top-right) -->
  <rect x="25.5" y="9.5" width="13" height="13" rx="2.5" fill="#FFF4E6"/>
  <rect x="41.5" y="9.5" width="13" height="13" rx="2.5" fill="#F5C04A"/>
  <rect x="41.5" y="25.5" width="13" height="13" rx="2.5" fill="#FFF4E6"/>
</svg>
